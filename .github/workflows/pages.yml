name: Publish Pages manually

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run tests/publication.test.ts
      - name: Derive repository base
        id: base
        env:
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          repo="${REPOSITORY#*/}"
          if [[ "${repo,,}" == "${OWNER,,}.github.io" ]]; then
            printf 'path=/\n' >> "$GITHUB_OUTPUT"
          else
            printf 'path=/%s/\n' "$repo" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and check publication boundary
        env:
          PAGES_BASE: ${{ steps.base.outputs.path }}
        run: npm run build -- --base="$PAGES_BASE"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
